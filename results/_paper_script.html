  const mid = (A + Bd) / 2;
  const ps = ray(mid, LEN * 0.97);

  svg.appendChild(el("line", {x1: ox, y1: oy, x2: W - 14, y2: oy,

  const arc = el("path", {d: `M ${ray(Bd, 96)[0]} ${ray(Bd, 96)[1]}

  svg.appendChild(arc);
  svg.appendChild(tx(ray(mid, 118)[0] + 4, ray(mid, 118)[1] + 4, "cos 0.74 to 0.85",
    {"font-size": 10.5}));

  function arrow(p, colour, w, dash) {
    const g = el("g");
    const ln = el("line", {x1: ox, y1: oy, x2: p[0], y2: p[1], stroke: colour,

    g.appendChild(ln);

    g.appendChild(el("path", {d:

    if (!RM) {

(function () {

    svg.appendChild(el("line", {x1: L - 8, y1: y(v), x2: W - R, y2: y(v),
      stroke: "var(--hair)", "stroke-width": 1}));
    svg.appendChild(tx(x(v), H - B + 22, v.toFixed(1), {"text-anchor": "middle",
      "font-size": 11}));
    svg.appendChild(tx(L - 14, y(v) + 4, v.toFixed(1), {"text-anchor": "end",

  svg.appendChild(tx((L + W - R) / 2, H - B + 46,

  MK.forEach(mk => {

      g.appendChild(el("circle", {cx, cy, r: 7, fill: MC[mk],
        stroke: "var(--raise)", "stroke-width": 2}));
      g.appendChild(tx(cx + 12, cy + 4, `${D.decompose[mk].label} ${reg}`,
        {"font-size": 11.5, fill: "var(--ink-2)", "font-weight": 500}));
      if (!RM) g.style.animation = `fade .55s ease ${stagger()}s both`;
      svg.appendChild(g);
      k++;
    });
  });
  document.getElementById("leakChart").appendChild(svg);
})();

/* ---- Figure 3, what predicts the answer ---- */
(function () {
  const W = 800, H = 330, L = 74, R = 22, T = 46, B = 80;
  const keys = [["lips", "lips value"], ["eyes", "eyes value"],
                ["last", "region acted on last"], ["more", "region acted on more often"]];
  const hi = 0.62;
  const gw = (W - L - R) / MK.length;
  const bw = gw / (keys.length + 0.7);
  const y = v => T + (1 - v / hi) * (H - T - B);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Which label best predicts the read out in each model"});
  for (let v = 0; v <= 0.601; v += 0.2) {
    svg.appendChild(el("line", {x1: L, y1: y(v), x2: W - R, y2: y(v),
      stroke: v === 0 ? "var(--ink)" : "var(--hair)", "stroke-width": v === 0 ? 1.4 : 1}));
    svg.appendChild(tx(L - 12, y(v) + 4, v.toFixed(1), {"text-anchor": "end", "font-size": 11}));
  }
  const SHADE = {lips: .34, eyes: .58, last: .82, more: 1};
  MK.forEach((mk, gi) => {
    const x0 = L + gi * gw + bw * 0.5;
    const vals = D.mechanism[mk];
    let best = null;
    keys.forEach(([k]) => { if (best === null || vals[k] > vals[best]) best = k; });
    keys.forEach(([k, lab], bi) => {
      const px = x0 + bi * bw, v = vals[k];
      const bar = el("rect", {x: px, y: y(v), width: bw * 0.84,
        height: y(0) - y(v), fill: MC[mk], opacity: SHADE[k]});
      if (!RM) { bar.style.transformOrigin = `${px}px ${y(0)}px`;
        bar.style.transform = "scaleY(1)";
        bar.style.animation = `fade .5s ease ${stagger()}s both`; }
      svg.appendChild(bar);
      if (k === best) svg.appendChild(tx(px + bw * 0.42, y(v) - 7, "▲",
        {"text-anchor": "middle", "font-size": 10, fill: MC[mk]}));
      const t = tx(0, 0, lab, {"font-size": 9.5, fill: "var(--ink-3)",
        "text-anchor": "end"});
      t.setAttribute("transform",
        `translate(${px + bw * 0.5} ${H - B + 12}) rotate(-38)`);
      svg.appendChild(t);
    });
    svg.appendChild(tx(x0 + (keys.length * bw) / 2 - bw * 0.5, T - 20,
      D.decompose[mk].label, {"text-anchor": "middle", "font-size": 12.5,
      fill: "var(--ink)", "font-weight": 600}));
  });
  svg.appendChild(tx(L - 12, T - 20, "movement", {"text-anchor": "end", "font-size": 10.5}));
  svg.appendChild(tx((L + W - R) / 2, H - 8,
    "triangle marks the strongest predictor in each model",
    {"text-anchor": "middle", "font-size": 11, fill: "var(--ink-3)"}));
  document.getElementById("mechChart").appendChild(svg);
})();

/* ---- Figure 4, decomposition results ---- */
(function () {
  const arms = [["shared", "shared component"], ["differential", "region specific component"],
                ["full", "full direction"], ["random", "random, matched norm"]];
  const W = 800, rowH = 100, T = 44, B = 54, L = 196, R = 104;
  const H = T + arms.length * rowH + B;
  const lo = -0.04, hi = 0.09;
  const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Difference between the two regions read outs for each steered component"});
  for (let v = -0.04; v <= 0.0901; v += 0.02) {
    const z = Math.abs(v) < 1e-9;
    svg.appendChild(el("line", {x1: x(v), y1: T - 12, x2: x(v), y2: H - B + 6,
      stroke: z ? "var(--ink)" : "var(--hair)", "stroke-width": z ? 1.4 : 1}));
    svg.appendChild(tx(x(v), H - B + 22, (v > 0 ? "+" : "") + v.toFixed(2),
      {"text-anchor": "middle", "font-size": 11}));
  }
  svg.appendChild(tx((L + W - R) / 2, H - B + 42,
    "difference between the two regions' read outs",
    {"text-anchor": "middle", "font-size": 11.5}));
  arms.forEach(([key, label], ai) => {
    const y0 = T + ai * rowH;
    if (ai) svg.appendChild(el("line", {x1: 0, y1: y0 - 12, x2: W, y2: y0 - 12,
      stroke: "var(--hair)", "stroke-width": 1}));
    svg.appendChild(tx(L - 18, y0 + 26, label, {"text-anchor": "end",
      "font-size": 13, "font-weight": 600, fill: "var(--ink)"}));
    MK.forEach((mk, i) => {
      const a = D.decompose[mk].arms[key].difference;
      const yy = y0 + 6 + i * 19, h = 12;
      const ns = (a.ci95[0] <= 0 && a.ci95[1] >= 0);
      const x0 = x(Math.min(0, a.mean)), x1 = x(Math.max(0, a.mean));
      const bar = el("rect", {x: x0, y: yy, width: Math.max(x1 - x0, 1.4),
        height: h, fill: MC[mk], opacity: ns ? 0.26 : 1});
      if (!RM) { bar.style.transformOrigin = `${x(0)}px ${yy}px`;
        bar.style.animation = `grow .66s cubic-bezier(.16,.9,.28,1) ${stagger()}s both`; }
      svg.appendChild(bar);
      svg.appendChild(el("line", {x1: x(a.ci95[0]), y1: yy + h / 2,
        x2: x(a.ci95[1]), y2: yy + h / 2, stroke: "var(--ink)", "stroke-width": 1.1}));
      [a.ci95[0], a.ci95[1]].forEach(v => svg.appendChild(el("line",
        {x1: x(v), y1: yy + 1, x2: x(v), y2: yy + h - 1,
         stroke: "var(--ink)", "stroke-width": 1.1})));
      svg.appendChild(tx(W - R + 10, yy + h - 1,
        `${a.mean >= 0 ? "+" : ""}${a.mean.toFixed(3)}`,
        {"font-size": 11.5, "font-variant-numeric": "tabular-nums",
         fill: ns ? "var(--ink-3)" : "var(--ink)", "font-weight": ns ? 400 : 600}));
    });
  });
  MK.forEach((mk, i) => {
    const lx = L + i * 146;
    svg.appendChild(el("rect", {x: lx, y: T - 34, width: 11, height: 11, fill: MC[mk]}));
    svg.appendChild(tx(lx + 17, T - 24, D.decompose[mk].label,
      {"font-size": 11.5, fill: "var(--ink-2)", "font-weight": 500}));
  });
  document.getElementById("decompChart").appendChild(svg);
})();

/* ---- Figure 5, decay ---- */
(function () {
  const W = 800, H = 312, L = 72, R = 132, T = 30, B = 58;
  const bins = D.binding.gpt2.bins, lo = -0.06, hi = 0.18;
  const x = i => L + i * (W - L - R) / (bins.length - 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Binding margin against distance since the value last changed"});
  for (let v = -0.05; v <= 0.1801; v += 0.05) {
    const yy = y(v); if (yy < T - 1 || yy > H - B + 1) continue;
    const z = Math.abs(v) < 1e-9;
    svg.appendChild(el("line", {x1: L, y1: yy, x2: W - R, y2: yy,
      stroke: z ? "var(--ink)" : "var(--hair)", "stroke-width": z ? 1.4 : 1}));
    svg.appendChild(tx(L - 12, yy + 4, (v > 0 ? "+" : "") + v.toFixed(2),
      {"text-anchor": "end", "font-size": 11}));
  }
  bins.forEach((b, i) => svg.appendChild(tx(x(i), H - B + 22, b,
    {"text-anchor": "middle", "font-size": 12, fill: "var(--ink-2)", "font-weight": 500})));
  svg.appendChild(tx((L + W - R) / 2, H - B + 42,
    "sentences since this value last changed", {"text-anchor": "middle", "font-size": 11.5}));
  MK.forEach((mk, si) => {
    const vals = D.binding[mk].values;
    const d = vals.map((v, i) => `${i ? "L" : "M"} ${x(i)} ${y(v)}`).join(" ");
    const path = el("path", {d, fill: "none", stroke: MC[mk], "stroke-width": 2.6,
      "stroke-linejoin": "round", "stroke-linecap": "round"});
    svg.appendChild(path);
    if (!RM) { const len = Math.ceil(path.getTotalLength()) + 2;
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.style.animation = `draw 1s cubic-bezier(.2,.85,.3,1) ${stagger()}s forwards`; }
    vals.forEach((v, i) => svg.appendChild(el("circle", {cx: x(i), cy: y(v), r: 4,
      fill: "var(--raise)", stroke: MC[mk], "stroke-width": 2.2})));
    svg.appendChild(tx(W - R + 12, y(vals[vals.length - 1]) + 4,
      D.binding[mk].label, {"font-size": 12, fill: MC[mk], "font-weight": 600}));
  });
  document.getElementById("decayChart").appendChild(svg);
})();

/* ---- Figure 6, baseline gaps ---- */
(function () {
  const W = 800, H = 330, L = 78, R = 26, T = 42, B = 66;
  const lo = -0.13, hi = 0.20;
  const x = i => L + (i + 0.5) * (W - L - R) / D.gaps.length;
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Accuracy gap over the static embedding baseline in three models"});
  for (let v = -0.10; v <= 0.1851; v += 0.05) {
    const yy = y(v), z = Math.abs(v) < 1e-9;
    svg.appendChild(el("line", {x1: L, y1: yy, x2: W - R, y2: yy,
      stroke: z ? "var(--ink)" : "var(--hair)", "stroke-width": z ? 1.4 : 1}));
    svg.appendChild(tx(L - 12, yy + 4, (v > 0 ? "+" : "") + v.toFixed(2),
      {"text-anchor": "end", "font-size": 11}));
  }
  const bw = 16;
  D.gaps.forEach((g, i) => {
    MK.forEach((mk, j) => {
      const d = g[mk], px = x(i) + (j - 1.5) * (bw + 4) - bw / 2;
      const sig = d.p < 0.05;
      const top = d.gap >= 0 ? y(d.gap) : y(0), h = Math.abs(y(d.gap) - y(0));
      const bar = el("rect", {x: px, y: top, width: bw, height: Math.max(h, 1),
        fill: MC[mk], opacity: sig ? 1 : 0.26});
      if (!RM) { bar.style.transformOrigin = `${px}px ${y(0)}px`;
        bar.style.animation = `grow .66s cubic-bezier(.16,.9,.28,1) ${stagger()}s both`; }
      svg.appendChild(bar);
      const cx = px + bw / 2;
      svg.appendChild(el("line", {x1: cx, y1: y(d.ci95[0]), x2: cx, y2: y(d.ci95[1]),
        stroke: "var(--ink)", "stroke-width": 1.2}));
    });
    const nm = g.target.split(".");
    svg.appendChild(tx(x(i), H - B + 24, nm[0], {"text-anchor": "middle",
      "font-size": 12.5, fill: "var(--ink)", "font-weight": 600}));
    svg.appendChild(tx(x(i), H - B + 40, nm[1], {"text-anchor": "middle", "font-size": 12}));
  });
  MK.forEach((mk, j) => {
    const lx = L + j * 132;
    svg.appendChild(el("rect", {x: lx, y: T - 32, width: 11, height: 11, fill: MC[mk]}));
    svg.appendChild(tx(lx + 17, T - 22, D.decompose[mk].label,
      {"font-size": 11.5, fill: "var(--ink-2)", "font-weight": 500}));
  });
  document.getElementById("gapChart").appendChild(svg);

  const tb = document.getElementById("gapTable");
  D.gaps.forEach(g => {
    const cell = d => {
      const c = d.p < 0.05 ? (d.gap > 0 ? "pos" : "neg") : "nil";
      return `<td class="${c}">${d.gap >= 0 ? "+" : ""}${d.gap.toFixed(3)}</td>` +
             `<td class="${c}">${d.p < 0.0001 ? "<0.0001" : d.p.toFixed(3)}</td>`;
    };
    tb.insertAdjacentHTML("beforeend", `<tr><td><code>${g.target}</code></td>` +
      MK.map(mk => cell(g[mk])).join("") + `</tr>`);
  });
})();

/* ---- Figure 7, depth ---- */
(function () {
  const W = 800, H = 272, L = 176, R = 34, T = 46, B = 52;
  const x = f => L + f * (W - L - R);
  const y = i => T + i * (H - T - B) / (MK.length - 1);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Best probing layer as a fraction of depth"});
  [[0, "embeddings"], [0.5, "middle"], [1, "output"]].forEach(([f, lab]) => {
    svg.appendChild(el("line", {x1: x(f), y1: T - 20, x2: x(f), y2: H - B + 8,
      stroke: "var(--hair)", "stroke-width": 1, "stroke-dasharray": "3 4"}));
    svg.appendChild(tx(x(f), T - 28, lab, {"text-anchor": "middle", "font-size": 11}));
  });
  MK.forEach((mk, ri) => {
    const row = D.depth[mk], yy = y(ri);
    svg.appendChild(el("line", {x1: L, y1: yy, x2: W - R, y2: yy,
      stroke: "var(--hair)", "stroke-width": 1}));
    svg.appendChild(tx(L - 18, yy + 4, `${row.label}, ${row.n_layers} layers`,
      {"text-anchor": "end", "font-size": 12, fill: "var(--ink)", "font-weight": 500}));
    const seen = {};
    row.points.forEach(d => {
      const k = d.frac.toFixed(3); seen[k] = (seen[k] || 0) + 1;
      const off = (seen[k] - 1) * 10 - 5;
      const c = el("circle", {cx: x(d.frac), cy: yy + off, r: 5.4, fill: MC[mk],
        stroke: "var(--raise)", "stroke-width": 1.6});
      c.appendChild(el("title")).textContent = `${d.target}, layer ${d.layer}`;
      if (!RM) c.style.animation = `fade .5s ease ${stagger()}s both`;
      svg.appendChild(c);
    });
  });
  svg.appendChild(tx((L + W - R) / 2, H - B + 30, "best layer divided by depth",
    {"text-anchor": "middle", "font-size": 11.5}));
  document.getElementById("depthChart").appendChild(svg);
})();

/* ---- Figure 8, faces ---- */
(function () {
  const F = D.facemap, TG = F.targets, N = F.frames.length;
  const SW = {bare: "var(--sw-bare)", nude: "var(--sw-nude)", pink: "var(--sw-pink)",
              red: "var(--sw-red)", brown: "var(--sw-brown)"};
  const lid = (cx, cy, r) => `M ${cx - r * 1.25} ${cy - 1}
    Q ${cx} ${cy - r * 1.95} ${cx + r * 1.25} ${cy - 1}
    Q ${cx} ${cy - r * 0.5} ${cx - r * 1.25} ${cy - 1} Z`;
  const eye = (cx, cy, r) => `M ${cx - r} ${cy} Q ${cx} ${cy - r * 0.82} ${cx + r} ${cy}
    Q ${cx} ${cy + r * 0.72} ${cx - r} ${cy} Z`;
  const lip = (cx, cy, w, hu, hl) => `M ${cx - w} ${cy}
    C ${cx - w * 0.58} ${cy - hu * 1.55} ${cx - w * 0.22} ${cy - hu * 0.95} ${cx} ${cy - hu * 0.34}
    C ${cx + w * 0.22} ${cy - hu * 0.95} ${cx + w * 0.58} ${cy - hu * 1.55} ${cx + w} ${cy}
    C ${cx + w * 0.52} ${cy + hl * 1.7} ${cx - w * 0.52} ${cy + hl * 1.7} ${cx - w} ${cy} Z`;

  function face(st, truth, ring) {
    const svg = el("svg", {viewBox: "0 0 190 214", role: "img"});
    const EY = 96, ER = 13, LX = 71, RX = 119;
    svg.appendChild(el("path", {d: "M40,86 Q42,26 95,26 Q148,26 150,86", fill: "var(--sunk)"}));
    svg.appendChild(el("ellipse", {cx: 95, cy: 108, rx: 55, ry: 74,
      fill: "var(--sunk)", stroke: "var(--edge)", "stroke-width": 1}));
    [LX, RX].forEach(ex => svg.appendChild(el("path", {
      d: `M ${ex - ER * 1.15} ${EY - ER * 1.9} Q ${ex} ${EY - ER * 2.65} ${ex + ER * 1.05} ${EY - ER * 1.95}`,
      fill: "none", stroke: "var(--ink-2)", "stroke-width": 2.4,
      "stroke-linecap": "round", opacity: .7})));
    const ec = st["eyes.color"], ef = st["eyes.finish"];
    const lc = st["lips.color"], lf = st["lips.finish"];
    const eok = truth ? (ec === truth["eyes.color"] && ef === truth["eyes.finish"]) : true;
    const lok = truth ? (lc === truth["lips.color"] && lf === truth["lips.finish"]) : true;
    const eS = ring ? (eok ? "var(--ok)" : "var(--warn)") : "var(--ink-2)";
    const lS = ring ? (lok ? "var(--ok)" : "var(--warn)") : "var(--ink-2)";
    [LX, RX].forEach(ex => {
      svg.appendChild(el("path", {d: lid(ex, EY, ER), fill: SW[ec] || "var(--sw-bare)",
        opacity: ec === "bare" ? .32 : .82, stroke: eS, "stroke-width": ring ? 2.1 : 1.1,
        "stroke-dasharray": ring && !eok ? "4 3" : "none", "stroke-linejoin": "round"}));
      svg.appendChild(el("path", {d: eye(ex, EY + 5, ER * 0.92), fill: "var(--raise)",
        stroke: "var(--ink-2)", "stroke-width": 1.3}));
      svg.appendChild(el("circle", {cx: ex, cy: EY + 5, r: 4.4, fill: "var(--ink-2)"}));
      svg.appendChild(el("circle", {cx: ex + 1.4, cy: EY + 3.4, r: 1.4, fill: "var(--raise)"}));
    });
    svg.appendChild(el("path", {d: "M95,104 Q92,126 99,129", fill: "none",
      stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-linecap": "round", opacity: .5}));
    svg.appendChild(el("path", {d: lip(95, 156, 25, 11, 12),
      fill: SW[lc] || "var(--sw-bare)", opacity: lc === "bare" ? .32 : .85,
      stroke: lS, "stroke-width": ring ? 2.1 : 1.1,
      "stroke-dasharray": ring && !lok ? "4 3" : "none", "stroke-linejoin": "round"}));
    svg.appendChild(el("path", {d: "M72,156 Q95,150 118,156", fill: "none",
      stroke: "var(--ink)", "stroke-width": .9, opacity: .32}));
    return svg;
  }
  const mount = (id, node) => { const t = document.getElementById(id);
    t.innerHTML = ""; t.appendChild(node); };
  const word = v => v === "none" ? "bare" : v;
  const panels = [["faceTrue", "readTrue", "true", false],
                  ["faceA", "readA", "gpt2", true],
                  ["faceB", "readB", "pythia", true],
                  ["faceC", "readC", "qwen", true]];
  function render(i) {
    const f = F.frames[i];
    panels.forEach(([fid, rid, key, ring]) => {
      mount(fid, face(f[key], ring ? f.true : null, ring));
      document.getElementById(rid).innerHTML = TG.map(t => {
        const ok = !ring || f[key][t] === f.true[t];
        const c = ring ? (ok ? "var(--ok)" : "var(--warn)") : "var(--ink-3)";
        return `<div style="color:${c}">${t.replace(".", " ")} ${word(f[key][t])}</div>`;
      }).join("");
    });
    document.getElementById("faceSentence").textContent = f.sentence;
    document.getElementById("faceStep").textContent = `${i + 1} / ${N}`;
    document.getElementById("faceRange").value = i;
  }
  let idx = 0, timer = null;
  const btn = document.getElementById("playBtn"), rng = document.getElementById("faceRange");
  rng.max = N - 1;
  const stop = () => { clearInterval(timer); timer = null; btn.textContent = "Play"; };
  btn.addEventListener("click", () => {
    if (timer) return stop();
    btn.textContent = "Pause";
    timer = setInterval(() => { idx = (idx + 1) % N; render(idx); }, 2200);
  });
  rng.addEventListener("input", e => { stop(); idx = +e.target.value; render(idx); });
  render(0);
})();
</script>
